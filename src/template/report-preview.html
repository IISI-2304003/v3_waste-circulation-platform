<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF 樣板預覽（Live Server）</title>
  <!-- Handlebars：需要網路。若要離線使用，下載後改成本機路徑 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
  <style>
    /* ───── 預覽外框（只在預覽用，不屬於樣板） ───── */
    html,
    body {
      margin: 0;
    }

    body {
      background: #e9edf1;
      font-family: 'NotoSansTC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background: #fff;
      font-size: 13px;
      color: #1f2d3d;
      flex-wrap: wrap;
    }

    .toolbar button {
      border: 1px solid #4caf50;
      background: #fff;
      color: #2e7d32;
      border-radius: 6px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .toolbar button.on {
      background: #4caf50;
      color: #fff;
    }

    .scroll {
      overflow-x: auto;
      padding: 20px 8px 40px;
    }

    .paper {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      background: #fff;
      padding: 15mm;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .25);
    }

    /* ───── 以下為樣板 CSS（正式 .hbs 的 <style> 內容；body 規則在預覽中改掛 .paper） ───── */
    .paper * {
      box-sizing: border-box;
    }

    .paper {
      color: #1f2d3d;
      line-height: 1.6;
      font-size: 12px;
    }

    .paper p {
      margin: 0;
    }

    h1 {
      font-size: 22px;
      color: #1f4d47;
      margin: 0 0 4px;
    }

    .meta {
      font-size: 11px;
      color: #5b7890;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 15px;
      color: #2b5876;
      border-bottom: 1px solid #dfe9f3;
      padding-bottom: 4px;
      margin: 20px 0 10px;
      break-after: avoid;
    }

    .mode-direction-label {
      margin: 0 0 4px;
      color: #355b78;
      font-size: 11px;
      font-weight: 700;
    }

    .section-note {
      font-size: 11px;
      color: #5b7890;
      margin: 0 0 8px;
    }

    .mode-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .mode-summary {
      background: #f7fbff;
      border: 1px solid #dbe8f3;
      border-radius: 8px;
      min-width: 0;
      padding: 10px;
      page-break-inside: avoid;
    }

    .mode-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(122, 206, 255, .4), rgba(178, 149, 255, .38));
      color: #0f4f9f;
      font-size: 12px;
      font-weight: 700;
      margin-right: 8px;
      white-space: nowrap;
    }

    .steps-text {
      font-size: 12px;
      color: #496b79;
      margin: 6px 0 0;
    }

    .mode-summary-text {
      margin: 6px 0 0;
      color: #496b79;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .summary-table th {
      width: 130px;
    }

    th,
    td {
      border: 1px solid #dbe8f3;
      padding: 6px 8px;
      font-size: 11px;
      word-break: break-word;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #f5f9fc;
      color: #355b78;
    }

    .vendor-card {
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
      page-break-inside: avoid;
    }

    .vendor-card .tag-row .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
      margin-right: 6px;
    }

    .badge.category {
      background: #e8f4ff;
      color: #1a73e8;
    }

    .badge.reuse {
      background: #e8fff0;
      color: #1aaa5c;
    }

    .vendor-card h3 {
      font-size: 14px;
      margin: 6px 0;
      color: #1a1a1a;
    }

    .vendor-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px 12px;
      margin-bottom: 6px;
    }

    .vendor-meta-grid .item .label {
      font-size: 10px;
      color: #26a69a;
      font-weight: 700;
    }

    .vendor-meta-grid .item .value {
      font-size: 11px;
      color: #333;
      margin-top: 2px;
    }

    .reason-tags .tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: #faedb5;
      color: #c78305;
      font-size: 10px;
      font-weight: 600;
      margin: 0 4px 4px 0;
    }

    .internal-note {
      background: #fdf6e3;
      border: 1px dashed #e0c46c;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      color: #7a6117;
      text-align: center;
    }

    .empty-hint {
      font-size: 12px;
      color: #999;
      padding: 10px 0;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 10px;
      color: #999;
      text-align: right;
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <span>預覽模式：</span>
    <button id="btnNormal" class="on">一般模式 (isSimple = false)</button>
    <button id="btnSimple">簡易模式 (isSimple = true)</button>
  </div>
  <div class="scroll">
    <div class="paper" id="paper"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
     Handlebars 樣板（對應正式 .hbs 的 <body> 內容）
     與資料格式的對應：
       分類標籤   → this.name
       再利用標籤 → is_reuse_company === '是' 且 name 不是「再利用機構」（用 eq helper）
       許可期限   → permit_end_date 沒資料就不顯示該欄
       模式標題   → this.title 沒資料就不顯示
     ═══════════════════════════════════════════════════════════ -->
  <script id="tpl" type="text/x-handlebars-template">
  <h1>{{#if isSimple}}廠商清單報告{{else}}技術決策完整分析報告{{/if}}</h1>
  <p class="meta">
    {{#if isSimple}}廢棄物代碼：{{wasteCode.code}} {{wasteCode.name}}　｜　{{/if}}匯出時間：{{exportTime}}
  </p>

  {{!-- ═════ 一般模式：推薦循環模式 + 決策需求摘要 ═════ --}}
  {{#unless isSimple}}
    <h2>推薦循環模式</h2>
    <div class="mode-summary-grid">
      {{#each mode}}
        <div class="mode-summary">
          <p class="mode-direction-label">{{#if this.isExternal}}廠外執行方向{{else}}廠內執行方向{{/if}}</p>
          <span class="mode-badge">{{this.modeName}}</span>
          {{#if this.title}}<strong>{{this.title}}</strong>{{/if}}
          <p class="steps-text">{{this.stepsText}}</p>
          {{#if this.summary}}
            <p class="mode-summary-text">{{this.summary}}</p>
          {{/if}}
        </div>
      {{/each}}
    </div>

    <h2>決策需求摘要</h2>
    {{#if demandSummary.length}}
      <table class="summary-table">
        <tbody>
          {{#each demandSummary}}
            <tr><th>{{this.label}}</th><td>{{this.value}}</td></tr>
          {{/each}}
        </tbody>
      </table>
    {{else}}
      <p class="empty-hint">無可匯出資料</p>
    {{/if}}
  {{/unless}}

  {{!-- ═════ 廠商清單：有資料才顯示；簡易模式無資料時顯示提示 ═════ --}}
  {{#if vendors.length}}
    <h2>執行方式與技術廠商</h2>
    {{#if isSimple}}
      <p class="section-note">共 {{vendors.length}} 家符合此廢棄物代碼之廠商</p>
    {{else}}
      {{#if externalModeNames}}
        <p class="section-note">以下廠商適用於：{{externalModeNames}}</p>
      {{/if}}
    {{/if}}

    {{#each vendors}}
      <div class="vendor-card">
        <div class="tag-row">
          <span class="badge category">{{this.name}}</span>
          {{#if (eq this.is_reuse_company '是')}}
            {{#unless (eq this.name '再利用機構')}}
              <span class="badge reuse">再利用機構</span>
            {{/unless}}
          {{/if}}
        </div>
        <h3>{{this.company_name}}</h3>
        <div class="vendor-meta-grid">
          <div class="item"><div class="label">再利用廢棄物</div><div class="value">{{this.waste_name}}</div></div>
          <div class="item"><div class="label">所在地</div><div class="value">{{this.region}}</div></div>
          {{#unless @root.isSimple}}
            <div class="item"><div class="label">距離</div><div class="value">{{this.road_distance_km}} km</div></div>
          {{/unless}}
          <div class="item"><div class="label">許可總量</div><div class="value">{{this.permitted_quantity}} 噸/月</div></div>
          <div class="item"><div class="label">前月收受總量</div><div class="value">{{this.capacityLevelText}}</div></div>
          <div class="item"><div class="label">事業管制編號</div><div class="value">{{this.control_number}}</div></div>
          {{#if this.permit_end_date}}
            <div class="item"><div class="label">有效許可期限</div><div class="value">{{this.permit_end_date}}</div></div>
          {{/if}}
        </div>
        {{#if this.conditional_judgment.length}}
          <div class="reason-tags">
            {{#each this.conditional_judgment}}
              <span class="tag">{{this}}</span>
            {{/each}}
          </div>
        {{/if}}
      </div>
    {{/each}}
  {{else}}
    {{#if isSimple}}
      <h2>執行方式與技術廠商</h2>
      <p class="empty-hint">目前無廠商資料</p>
    {{/if}}
  {{/if}}

  {{!-- ═════ 廠內：自行執行說明（簡易模式不顯示） ═════ --}}
  {{#unless isSimple}}
    {{#if internalModeNames}}
      <h2>廠內自行執行</h2>
      <div class="internal-note">
        {{internalModeNames}}由產源事業於廠內自行執行，無須尋找外部技術廠商。
      </div>
    {{/if}}
  {{/unless}}

  <p class="footer-note">本報告由系統自動產出，僅供決策參考，實際合作仍應依相關條件評估。</p>
</script>

  <script>
    // ═════ 範例資料（與後端實際傳入格式相同） ═════
    const data = {
      isSimple: false,
      mode: [
        {
          modeName: '廠內模式2',
          mode_type: 'internal',
          isExternal: false,
          summary: '廢棄物於製程排出後,廠內回原製程作原料使用回原製程做原料使用。',
          stepsText: '原料購入  →  製程排出  →  廠內再利用  →  返回原製程'
        },
        {
          modeName: '廠外模式4',
          mode_type: 'external',
          isExternal: true,
          summary: '原料購入使用後，送至受產源實質自主管理之公司純化（再製）、調整成分與濃度，再返回原廠原製程循環使用。',
          stepsText: '原料購入  →  純化(再製)  →  調整成分  →  返回原製程'
        },
        {
          modeName: '廠外模式5',
          mode_type: 'external',
          isExternal: true,
          summary: '串聯同一法人各廠區間物質流，物料送回原供應商調整成分與濃度，再返回原廠原製程循環使用。',
          stepsText: '原料購入  →  法人前處理  →  供應商調整  →  返回原製程'
        }
      ],
      externalModeNames: '廠外模式4、廠外模式5',
      internalModeNames: '廠內模式2',
      demandSummary: [
        { label: '允收條件', value: '含水率 等於 1 %' },
        { label: '廢棄物來源製程', value: '260001 積體電路製造程序' },
        { label: '來源產業', value: '電子零組件製造業' },
        { label: '優先條件', value: '有再利用空間、有衍生廢棄物' }
      ],
      isInternalMode: false,
      vendors: [
        {
          control_number: 'E2601186',
          conditional_judgment: ['距離較近', '條件全部符合', '再利用量充足'],
          road_distance_km: 327,
          capacityLevel: 3,
          company_name: '鴻成科技有限公司',
          region: '高雄市',
          is_reuse_company: '是',
          waste_name: '廢液pH值小(等)於2.0(廢硫酸)',
          permitted_quantity: '2450',
          name: '再利用機構',
          capacityLevelText: '高'
        },
        {
          control_number: 'H5389720',
          conditional_judgment: ['條件全部符合', '再利用量充足'],
          road_distance_km: 56.92,
          capacityLevel: 1,
          company_name: '普森環保科技股份有限公司觀音廠',
          region: '桃園市',
          is_reuse_company: '是',
          waste_name: '廢液pH值小(等)於2.0(廢硫酸)',
          permitted_quantity: '950',
          name: '化學材料製造業',
          capacityLevelText: '低'
        },
        {
          control_number: 'L91A2853',
          conditional_judgment: ['條件部分符合', '再利用量充足'],
          road_distance_km: 167.28,
          capacityLevel: 3,
          company_name: '貝民股份有限公司台中港廠',
          region: '臺中市',
          is_reuse_company: '是',
          waste_name: '廢液pH值小(等)於2.0(廢硫酸)',
          permitted_quantity: '6000',
          name: '化學材料製造業',
          capacityLevelText: '高'
        },
        {
          control_number: 'O1703020',
          conditional_judgment: ['再利用量充足'],
          road_distance_km: 82.24,
          capacityLevel: 2,
          company_name: '貝民股份有限公司香山廠',
          region: '新竹市',
          is_reuse_company: '是',
          waste_name: '廢液pH值小(等)於2.0(廢硫酸)',
          permitted_quantity: '6000',
          name: '化學材料製造業',
          capacityLevelText: '中'
        }
      ],
      exportTime: '115-10-21 15:52:13'
    };

    // 簡易模式的標題會用到；你的範例資料沒有，這裡只是預覽用的假資料
    const previewWasteCode = { code: 'C-0202', name: '廢液pH值小（等）於2.0' };

    // ═════ 正式環境的後端也要註冊這個 helper ═════
    Handlebars.registerHelper('eq', function (a, b) { return a === b; });

    const template = Handlebars.compile(document.getElementById('tpl').innerHTML);
    const paper = document.getElementById('paper');
    const btnNormal = document.getElementById('btnNormal');
    const btnSimple = document.getElementById('btnSimple');

    function render(isSimple) {
      paper.innerHTML = template({ ...data, isSimple: isSimple, wasteCode: previewWasteCode });
      btnNormal.classList.toggle('on', !isSimple);
      btnSimple.classList.toggle('on', isSimple);
    }
    btnNormal.onclick = function () { render(false); };
    btnSimple.onclick = function () { render(true); };
    render(data.isSimple);
  </script>
</body>

</html>
